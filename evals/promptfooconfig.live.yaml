description: Live non-deterministic evaluation suite for Housing Policy Research Network
prompts:
  - file://prompts/research_request.txt
providers:
  - id: file://providers/hierarchical_provider.py
    label: hierarchical-live
    config:
      live: true
      pythonExecutable: python
tests: file://datasets/offline.yaml
defaultTest:
  assert:
    - type: python
      value: file://assertions/quality.py
metadata:
  live_search: true
  note: The checked-in provider remains offline deterministic; replace provider configuration with the live CLI/provider only when OPENAI_API_KEY and network access are explicitly enabled.
